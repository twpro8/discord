[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "prek>=0.4.10",
]

[tool.typos.files]
extend-exclude = [
    "uv.lock",
    "pnpm-lock.yaml",
    "backend/coverage/",
    "backend/htmlcov/",
    "frontend/dist/",
]

[tool.typos.default]
extend-ignore-re = [
    "selectin",
]
