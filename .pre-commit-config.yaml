repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.1.0
    hooks:
      - id: black

  - repo: local
    hooks:
      - id: local-mypy
        name: mypy check
        entry: uv run mypy --config-file backend/pyproject.toml
        require_serial: true
        language: unsupported
        types: [python]
